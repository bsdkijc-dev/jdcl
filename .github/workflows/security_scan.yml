name: Security & Privacy Scan
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no .env or kaggle.json committed
        run: |
          test ! -f .env
          test ! -f kaggle.json
      - name: Run privacy & secret pattern checks
        run: |
          ! grep -rnE "(KAGGLE_KEY\s*=\s*[A-Za-z0-9]{10,}|BEGIN RSA PRIVATE KEY)" src/ config/ docs/ || exit 1
